<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#1F1F1F"/>

  <!-- ===================== -->
  <!-- Film strip icon (left) -->
  <!-- ===================== -->
  <!-- Main body -->
  <rect x="6" y="14" width="52" height="46" rx="3" fill="#E5A00D"/>
  <!-- Left perforation strip -->
  <rect x="6" y="14" width="11" height="46" rx="3" fill="#2E2E2E"/>
  <!-- Right perforation strip -->
  <rect x="47" y="14" width="11" height="46" rx="3" fill="#2E2E2E"/>
  <!-- Left perf holes -->
  <rect x="9"  y="19" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="9"  y="30" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="9"  y="41" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="9"  y="52" width="5" height="5" rx="1" fill="#1F1F1F"/>
  <!-- Right perf holes -->
  <rect x="50" y="19" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="50" y="30" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="50" y="41" width="5" height="7" rx="1" fill="#1F1F1F"/>
  <rect x="50" y="52" width="5" height="5" rx="1" fill="#1F1F1F"/>
  <!-- Frame window -->
  <rect x="20" y="18" width="24" height="38" rx="2" fill="#2E2E2E" opacity="0.7"/>

  <!-- ===================== -->
  <!-- Monitor icon (right)  -->
  <!-- ===================== -->
  <!-- Screen -->
  <rect x="70" y="14" width="52" height="38" rx="5" fill="#E5A00D"/>
  <!-- Screen inner bezel -->
  <rect x="75" y="19" width="42" height="28" rx="3" fill="#2E2E2E" opacity="0.7"/>
  <!-- Monitor neck -->
  <rect x="93" y="52" width="8" height="8" rx="1" fill="#E5A00D"/>
  <!-- Monitor base -->
  <rect x="80" y="59" width="34" height="6" rx="3" fill="#E5A00D"/>

  <!-- ========================== -->
  <!-- Wide downward arrow        -->
  <!-- ========================== -->
  <!-- Arrow shaft -->
  <rect x="46" y="76" width="36" height="22" rx="2" fill="#E5A00D"/>
  <!-- Arrow head (wide triangle) -->
  <polygon points="14,98 114,98 64,120" fill="#E5A00D"/>

</svg>
